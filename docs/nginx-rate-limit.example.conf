# =========================================
# 文件名: nginx-rate-limit.example.conf
# 作用: Bug 平台线上网关层限流示例（Nginx）
# 说明:
# 1) 这是“示例模板”，请按你的域名、上游服务地址、证书路径修改
# 2) 建议与后端应用层限流同时开启，形成双层防护
# 3) 若使用 Kubernetes Ingress / 云网关，可按同样思路迁移
# =========================================

# -------------------------
# HTTP 级别：定义限流桶
# -------------------------
http {
    # 全站 IP 总量限流（保护服务不被打崩）
    # $binary_remote_addr: 以客户端 IP 做 key（内存占用更低）
    # zone=global_ip:80m  可保存较多活跃 key（按流量调整）
    # rate=20r/s          每个 IP 每秒 20 请求（全局基础阈值）
    limit_req_zone $binary_remote_addr zone=global_ip:80m rate=20r/s;

    # 登录接口：IP 维度（宽松）
    limit_req_zone $binary_remote_addr zone=login_ip:20m rate=1r/s;

    # 登录接口：设备维度（严格）
    # 前端需传 x-device-id 请求头
    # 如果客户端未传，则回退为 "no-device"，会共用桶（更严格）
    map $http_x_device_id $device_id_for_limit {
        default $http_x_device_id;
        ""      "no-device";
    }
    limit_req_zone $device_id_for_limit zone=login_device:30m rate=20r/m;

    # 业务接口全局 QPS 限流（按“接口+IP”）
    # 用于保护单个热点接口被刷爆
    limit_req_zone $binary_remote_addr zone=api_write_ip:30m rate=5r/s;

    upstream bug_platform_backend {
        # 按实际后端地址修改（示例本机 3000）
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name your-domain.com;

        # =============================
        # 1) 登录接口专项限流
        # =============================
        location = /api/auth/login {
            # IP 维度：突发 20，立即生效（nodelay）
            limit_req zone=login_ip burst=20 nodelay;

            # 设备维度：突发 10
            limit_req zone=login_device burst=10 nodelay;

            # 全局基础保护（可选）
            limit_req zone=global_ip burst=60 nodelay;

            proxy_pass http://bug_platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =============================
        # 2) 写操作接口限流（发布/接单/改状态）
        # =============================
        location ~* ^/api/bug($|/[^/]+/(take|status)$) {
            # 业务接口按 IP 限速（网关层兜底）
            limit_req zone=api_write_ip burst=30 nodelay;

            # 全局基础保护
            limit_req zone=global_ip burst=80 nodelay;

            proxy_pass http://bug_platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =============================
        # 3) 其他 API 默认转发
        # =============================
        location /api/ {
            # 可以给其他接口一个更宽松全局限流（可按需启用）
            limit_req zone=global_ip burst=120 nodelay;

            proxy_pass http://bug_platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
