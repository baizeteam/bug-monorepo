# =========================================
# 文件名: nginx-rate-limit.http.inc.conf
# 作用: 放在 nginx.conf 的 http {} 中
# 说明:
# 1) 本文件只定义限流共享区（limit_req_zone）和 map 变量
# 2) 业务路由的 limit_req 请放到 server/location（见 companion 文件）
# =========================================

# 全站 IP 总量保护（防打崩）
limit_req_zone $binary_remote_addr zone=global_ip:80m rate=20r/s;

# 登录接口 - IP 维度（较宽松）
limit_req_zone $binary_remote_addr zone=login_ip:20m rate=1r/s;

# 登录接口 - 设备维度（较严格）
# 前端会传 x-device-id；没传则落到 no-device 桶（更严格）
map $http_x_device_id $device_id_for_limit {
    default $http_x_device_id;
    ""      "no-device";
}
limit_req_zone $device_id_for_limit zone=login_device:30m rate=20r/m;

# 写接口 IP 维度兜底（发布/接单/状态）
limit_req_zone $binary_remote_addr zone=api_write_ip:30m rate=5r/s;
