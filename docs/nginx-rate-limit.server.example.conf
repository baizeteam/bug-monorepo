# =========================================
# 文件名: nginx-rate-limit.server.example.conf
# 作用: 站点 server 配置示例（可直接按需改域名/上游后使用）
# 依赖:
# - 需先在 http {} 引入/定义:
#   global_ip / login_ip / login_device / api_write_ip 这些 zone
# - 参考文件: nginx-rate-limit.http.inc.conf
# =========================================

upstream bug_platform_backend {
    # 按你的后端地址修改
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;

    # -----------------------------
    # 登录接口: 多维限流（IP + 设备 + 全局）
    # -----------------------------
    location = /api/auth/login {
        # IP: 1 r/s，允许瞬时突发 20
        limit_req zone=login_ip burst=20 nodelay;

        # 设备: 20 r/m，允许瞬时突发 10
        limit_req zone=login_device burst=10 nodelay;

        # 全局兜底
        limit_req zone=global_ip burst=60 nodelay;

        proxy_pass http://bug_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # 写操作接口: 发布/接单/状态更新
    # -----------------------------
    location ~* ^/api/bug($|/[^/]+/(take|status)$) {
        # 写接口 IP 兜底
        limit_req zone=api_write_ip burst=30 nodelay;

        # 全局兜底
        limit_req zone=global_ip burst=80 nodelay;

        proxy_pass http://bug_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # 其他 API 默认转发
    # -----------------------------
    location /api/ {
        # 可选全局限制
        limit_req zone=global_ip burst=120 nodelay;

        proxy_pass http://bug_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
